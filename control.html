<!doctype html>
<html lang="pt" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Controlo — Localização do Desfile</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Barlow+Condensed:wght@600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:var(--s3); }
    .ctrl-wrap { max-width:480px; width:100%; }
    .ctrl-title { font-family:var(--f-display); font-size:1.8rem; text-align:center; margin-bottom:var(--s4); color:var(--text-primary); }
    .ctrl-current {
      background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--r-lg);
      padding:var(--s3); text-align:center; margin-bottom:var(--s4);
    }
    .ctrl-current .label { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
    .ctrl-current .value { font-family:var(--f-head); font-size:1.4rem; font-weight:700; color:var(--gold); }
    .ctrl-conn { text-align:center; font-size:11px; margin-bottom:var(--s3); }
    .ctrl-conn.ok { color:#3B6D11; }
    .ctrl-conn.err { color:var(--red); }
    .ctrl-grid { display:flex; flex-direction:column; gap:10px; }
    .ctrl-btn {
      display:flex; align-items:center; gap:12px; padding:16px;
      background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-md);
      color:var(--text-primary); font-size:15px; font-weight:600; cursor:pointer;
      transition:all 0.2s; text-align:left; width:100%;
    }
    .ctrl-btn:active { background:var(--red); color:#fff; transform:scale(0.98); }
    .ctrl-btn.active-point { border-color:var(--gold); background:rgba(212,175,55,0.1); }
    .ctrl-num {
      width:32px; height:32px; border-radius:50%; background:var(--bg-input);
      display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0;
    }
    .ctrl-status { text-align:center; margin-top:var(--s3); font-size:13px; color:var(--text-muted); min-height:20px; }
    .ctrl-status.ok { color:#3B6D11; }
    .ctrl-status.err { color:var(--red); }
  </style>
</head>
<body>
  <div class="ctrl-wrap">
    <h1 class="ctrl-title">📍 Controlo de Rota</h1>

    <div class="ctrl-current">
      <div class="label">Ponto Actual</div>
      <div class="value" id="currentLabel">A carregar...</div>
    </div>

    <div class="ctrl-conn" id="connStatus">A ligar ao Firebase...</div>

    <div class="ctrl-grid" id="pointsGrid">
      <!-- gerado por JS -->
    </div>

    <div class="ctrl-status" id="status"></div>
  </div>

  <!-- Firebase SDK (compat, mais simples de usar sem build tools) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

  <script>
    // ════════════════════════════════════════
    // CONFIGURAÇÃO FIREBASE — preenche com os dados do teu projecto
    // (Firebase Console → Definições do Projecto → Os teus apps → Configuração SDK)
    // ════════════════════════════════════════
    const firebaseConfig = {
		apiKey: "AIzaSyAmq6R_EDak8JMHOSd3f0eNf2qym-kCNOc",
    	databaseURL: "https://desfile-palanca-default-rtdb.firebaseio.com",
    	projectId: "desfile-palanca"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const locRef = db.ref('localizacao');

    // Pontos da rota — edita conforme necessário
    const PONTOS = [
      { id: 0, label: 'Ainda não iniciado' },
      { id: 1, label: 'IASD Central — Concentração' },
      { id: 2, label: 'Início do Desfile — Rua Rey Katyavala' },
      { id: 3, label: 'Avenida de Portugal' },
      { id: 4, label: 'Rua Amílcar Cabral' },
      { id: 5, label: 'Rua da Missão' },
      { id: 6, label: 'Avenida Comandante Valódia' },
      { id: 7, label: 'Alameda Ho Chi Minh' },
      { id: 8, label: 'Chegada — IASD Central de Luanda' },
      { id: 9, label: 'Encerramento' },
    ];

    const grid = document.getElementById('pointsGrid');
    const currentLabel = document.getElementById('currentLabel');
    const status = document.getElementById('status');
    const connStatus = document.getElementById('connStatus');

    function render(activeId) {
      grid.innerHTML = '';
      PONTOS.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'ctrl-btn' + (p.id === activeId ? ' active-point' : '');
        btn.innerHTML = `<span class="ctrl-num">${p.id}</span><span>${p.label}</span>`;
        btn.onclick = () => updatePoint(p);
        grid.appendChild(btn);
      });
    }

    // Monitor de ligação ao Firebase
    db.ref('.info/connected').on('value', snap => {
      if (snap.val() === true) {
        connStatus.textContent = '● Ligado ao Firebase';
        connStatus.className = 'ctrl-conn ok';
      } else {
        connStatus.textContent = '○ Sem ligação — a tentar reconectar...';
        connStatus.className = 'ctrl-conn err';
      }
    });

    // Lê o valor actual em tempo real (atualiza sozinho se mudar noutro lado)
    locRef.on('value', snap => {
      const data = snap.val();
      const ponto = data && data.ponto !== undefined ? data.ponto : 0;
      const p = PONTOS.find(x => x.id === ponto) || PONTOS[0];
      currentLabel.textContent = p.label;
      render(ponto);
    }, err => {
      currentLabel.textContent = 'Erro ao carregar';
      render(0);
    });

    async function updatePoint(p) {
      status.textContent = 'A actualizar...';
      status.className = 'ctrl-status';
      try {
        await locRef.set({
          ponto: p.id,
          label: p.label,
          hora: new Date().toLocaleTimeString('pt-AO', { hour:'2-digit', minute:'2-digit' })
        });
        status.textContent = `✓ Actualizado para: ${p.label}`;
        status.className = 'ctrl-status ok';
      } catch (e) {
        status.textContent = '✗ Erro ao actualizar. Verifica a internet.';
        status.className = 'ctrl-status err';
      }
    }
  </script>
</body>
</html>
